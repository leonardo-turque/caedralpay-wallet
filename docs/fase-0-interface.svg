<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="910" viewBox="0 0 1000 910">
  <title>CaedralPay — fase 0: proposta estrutural da página principal e seletor</title>
  <desc>Dois estudos em tema escuro. Página principal com logo, seletor, saldo e quatro ações: Comprar e Trocar desativados; Enviar e Receber com destaque. Painel inferior com carteiras e contas. Não representa o aplicativo executando.</desc>
  <rect width="1000" height="910" fill="#222320"/>
  <g font-family="DejaVu Sans, sans-serif">
    <text x="40" y="42" fill="#ddd6cd" font-size="22" font-weight="bold">CAEDRALPAY / FASE 0</text>
    <text x="40" y="70" fill="#b7b8b2" font-size="14">Proposta estrutural • dados ilustrativos • implementação por fases</text>
    <rect x="40" y="102" width="430" height="724" rx="32" fill="#0b0b0b" stroke="#494a44"/>
    <rect x="530" y="102" width="430" height="724" rx="32" fill="#0b0b0b" stroke="#494a44"/>
    <text x="66" y="137" fill="#aaa7a2" font-size="12">01 / PÁGINA PRINCIPAL</text>
    <text x="556" y="137" fill="#aaa7a2" font-size="12">02 / SELETOR ABERTO</text>
    <rect x="66" y="167" width="40" height="40" rx="12" fill="#292824"/>
    <text x="86" y="193" fill="#ddd6cd" font-size="20" text-anchor="middle">C</text>
    <text x="120" y="183" fill="#f5f4f2" font-size="19" font-weight="bold">Minha carteira</text>
    <text x="120" y="205" fill="#aaa7a2" font-size="13">Conta 1</text>
    <path d="m409 183 7 7 7-7" fill="none" stroke="#ddd6cd" stroke-width="2" stroke-linecap="round"/>
    <text x="66" y="302" fill="#f5f4f2" font-size="55" font-weight="bold">R$ —</text>
    <text x="66" y="339" fill="#aaa7a2" font-size="14">Variação indisponível · Hoje</text>
    <text x="66" y="374" fill="#777973" font-size="12">Saldo ainda não consultado</text>
    <g aria-label="Comprar, desativado">
      <rect x="66" y="410" width="87" height="100" rx="22" fill="#171717"/>
      <text x="109.5" y="453" text-anchor="middle" fill="#777971" font-size="28">$</text>
      <text x="109.5" y="488" text-anchor="middle" fill="#85867e" font-size="13">Comprar</text>
    </g>
    <g aria-label="Trocar, desativado">
      <rect x="163" y="410" width="87" height="100" rx="22" fill="#171717"/>
      <path d="M198 432v23m-5-5 5 5 5-5m12 7v-23m-5 5 5-5 5 5" fill="none" stroke="#777971" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="206.5" y="488" text-anchor="middle" fill="#85867e" font-size="13">Trocar</text>
    </g>
    <g aria-label="Enviar">
      <rect x="260" y="410" width="87" height="100" rx="22" fill="#292824"/>
      <path d="m291 457 24-24m-20 0h20v20" fill="none" stroke="#ddd6cd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="303.5" y="488" text-anchor="middle" fill="#f5f4f2" font-size="13" font-weight="bold">Enviar</text>
    </g>
    <g aria-label="Receber">
      <rect x="357" y="410" width="87" height="100" rx="22" fill="#292824"/>
      <path d="m413 433-24 24m20 0h-20v-20" fill="none" stroke="#ddd6cd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="400.5" y="488" text-anchor="middle" fill="#f5f4f2" font-size="13" font-weight="bold">Receber</text>
    </g>
    <line x1="66" x2="444" y1="550" y2="550" stroke="#292a26"/>
    <text x="66" y="592" fill="#f5f4f2" font-size="20" font-weight="bold">Ativos</text>
    <text x="444" y="592" fill="#aaa7a2" font-size="11" text-anchor="end">FASE 4</text>
    <rect x="66" y="617" width="378" height="100" rx="16" fill="none" stroke="#34352f" stroke-dasharray="5 5"/>
    <text x="86" y="656" fill="#aaa7a2" font-size="14">Área reservada à lista de ativos</text>
    <text x="86" y="684" fill="#777973" font-size="12">Estados e dados em fase posterior</text>
    <rect x="556" y="167" width="40" height="40" rx="12" fill="#292824"/>
    <text x="576" y="193" fill="#ddd6cd" font-size="20" text-anchor="middle">C</text>
    <text x="610" y="191" fill="#888982" font-size="19">Minha carteira</text>
    <text x="556" y="294" fill="#676863" font-size="55" font-weight="bold">R$ —</text>
    <rect x="531" y="325" width="428" height="500" rx="28" fill="#151515"/>
    <rect x="722" y="338" width="46" height="4" rx="2" fill="#575852"/>
    <text x="556" y="382" fill="#f5f4f2" font-size="22" font-weight="bold">Carteiras e contas</text>
    <path d="m914 365 12 12m0-12-12 12" stroke="#aaa7a2" stroke-width="2"/>
    <text x="556" y="421" fill="#aaa7a2" font-size="12">MINHA CARTEIRA</text>
    <rect x="548" y="436" width="394" height="72" rx="16" fill="#292824"/>
    <circle cx="578" cy="472" r="17" fill="#ddd6cd"/>
    <text x="578" y="478" fill="#151515" font-size="14" text-anchor="middle">1</text>
    <text x="610" y="464" fill="#f5f4f2" font-size="16" font-weight="bold">Conta 1</text>
    <text x="610" y="487" fill="#aaa7a2" font-size="12">0x1234…5678 · exemplo</text>
    <path d="m906 469 5 5 10-11" fill="none" stroke="#ddd6cd" stroke-width="2"/>
    <circle cx="578" cy="550" r="17" fill="#32332e"/>
    <text x="578" y="556" fill="#ddd6cd" font-size="14" text-anchor="middle">2</text>
    <text x="610" y="542" fill="#f5f4f2" font-size="16">Reserva</text>
    <text x="610" y="565" fill="#aaa7a2" font-size="12">0xabcd…9012 · exemplo</text>
    <line x1="556" x2="934" y1="591" y2="591" stroke="#2c2d28"/>
    <text x="556" y="619" fill="#aaa7a2" font-size="12">OUTRA CARTEIRA</text>
    <circle cx="578" cy="652" r="17" fill="#32332e"/>
    <text x="578" y="658" fill="#ddd6cd" font-size="14" text-anchor="middle">1</text>
    <text x="610" y="644" fill="#f5f4f2" font-size="16">Conta 1</text>
    <text x="610" y="667" fill="#aaa7a2" font-size="12">0x9876…4321 · exemplo</text>
    <line x1="556" x2="934" y1="693" y2="693" stroke="#2c2d28"/>
    <rect x="556" y="709" width="378" height="46" rx="23" fill="#ddd6cd"/>
    <text x="745" y="738" fill="#151515" font-size="15" font-weight="bold" text-anchor="middle">Criar conta</text>
    <text x="745" y="788" fill="#ddd6cd" font-size="15" text-anchor="middle">Importar outra carteira</text>
    <text x="40" y="860" fill="#b7b8b2" font-size="13">Marca “C” esquemática: usar a logo Caedral existente na implementação.</text>
    <text x="40" y="885" fill="#b7b8b2" font-size="13">Tema e componentes próprios em Compose; referência de interação: MetaMask Mobile.</text>
  </g>
</svg>
