# Candidate for download.caedral.com. Provision DNS/TLS before deployment.
# Cloudflare: proxied DNS, Full (strict), WAF/rate limits; challenge the landing
# page, not the APK body. Restrict the origin to Cloudflare IP ranges separately.
map $http_cf_connecting_ip $wallet_download_rate_key {
    default $http_cf_connecting_ip;
    "" $binary_remote_addr;
}
limit_req_zone $wallet_download_rate_key zone=wallet_download_clients_v2:10m rate=30r/m;
server {
    listen 443 ssl;
    server_name download.caedral.com;
    ssl_certificate /etc/letsencrypt/live/download.caedral.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/download.caedral.com/privkey.pem;
    root /srv/caedral-wallet-beta;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        limit_req zone=wallet_download_clients_v2 burst=20 nodelay;
        proxy_pass http://127.0.0.1:8097;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 60s;
        client_max_body_size 8k;
    }
    location ~ /\. { deny all; }
}
