name: Wallet validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  packages: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORG_GRADLE_PROJECT_caedralGithubUser: ${{ github.actor }}
      ORG_GRADLE_PROJECT_caedralGithubToken: ${{ secrets.WALLET_CORE_READ_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Android SDK
        run: |
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0'
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
      - name: Build, unit tests and lint
        run: ./gradlew --no-configuration-cache :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug
      - name: Isolated NFC prototype build and tests
        run: ./gradlew --no-configuration-cache :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug -PcaedralIsolatedUiTest=true -PcaedralProtocolPreview=true
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.8.7
      - name: Settlement and adversarial tests
        run: forge test --root protocol -vv
      - name: Recurring keeper E2E on local Anvil
        run: |
          npm ci --prefix protocol/keeper --ignore-scripts --no-audit --no-fund
          python3 qa/run-origin-tests.py --keeper-only
  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download protection tests
        run: node --test distribution/*.test.mjs
      - name: Python and shell syntax
        run: |
          python3 -m py_compile scripts/*.py distribution/*.py qa/run-origin-tests.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
          bash -n qa/run-evm-tests.sh distribution/install-standby.sh distribution/install-tls.sh
