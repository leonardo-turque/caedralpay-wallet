name: Wallet validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  packages: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORG_GRADLE_PROJECT_caedralGithubUser: ${{ github.actor }}
      ORG_GRADLE_PROJECT_caedralGithubToken: ${{ secrets.WALLET_CORE_READ_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Android SDK
        run: |
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37' 'build-tools;36.0.0'
      - name: Build, unit tests and lint
        run: ./gradlew --no-configuration-cache :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download protection tests
        run: node --test distribution/server.test.mjs
      - name: Python and shell syntax
        run: |
          python3 -m py_compile scripts/*.py
          bash -n qa/run-evm-tests.sh distribution/install-standby.sh distribution/install-tls.sh
